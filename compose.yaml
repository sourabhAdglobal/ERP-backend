
services:
  postgres:
    image: postgres:17
    container_name: enterprisehub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: enterprisehub
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp_user -d enterprisehub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: